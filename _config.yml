# Pages shown in navbar
nav_pages:
  - name: research
  - name: about
  - name: publications
  - name: cv
    label: CV
  - name: blogs

include:
  - .htaccess
  - _pages

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  math_engine: mathjax
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: false

plugins: ["jekyll/scholar"]

scholar:
  last_name: Wang
  first_name: [Yukai]

  style: citesty
  locale: en

  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"

  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_boostrap.sh
  - switch_theme.sh
  - tags
  - Rakefile


  - README.md
  - .idea
  - tools
  - vendor
  - _pages/team.md
  - _pages/talks.md
  - _pages/teaching.md
  - _pages/software.md
  - papers/example_proceeding.pdf
  - papers/feynman06.pdf
  - papers/feynman39.pdf
